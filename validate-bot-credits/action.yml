name: Validate bot release credits
description: Rehearse a bot-authored fragment without crediting the bot in public notes
runs:
  using: composite
  steps:
    - name: Verify the bot fixture
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test "$(gh api repos/tox-dev/devpi-process/pulls/288 --jq .user.login)" = 'dependabot[bot]'
        test "$(gh api repos/tox-dev/devpi-process/pulls/288 --jq .user.type)" = Bot
    - name: Create the bot fixture
      shell: bash
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/bot-fragments"
        printf 'Document a bot-owned dependency fix.\n' >"$RUNNER_TEMP/bot-fragments/+bot.bugfix.md"
        printf '+bot.bugfix.md\tDependency update (#288)\n' >"$RUNNER_TEMP/bot-commits.tsv"
        printf '* Dependency update by @dependabot[bot] in https://github.com/tox-dev/devpi-process/pull/288\n' \
          >"$RUNNER_TEMP/bot-generated.md"
    - name: Link the bot fragment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        release-creator fragments \
          --directory "$RUNNER_TEMP/bot-fragments" \
          --repository tox-dev/devpi-process \
          --commit-map "$RUNNER_TEMP/bot-commits.tsv" \
          --resolve-authors
    - name: Render bot release notes
      shell: bash
      run: |
        set -euo pipefail
        printf '## 1.0.0 (today)\n\n### Fixed\n\n- %s\n' \
          "$(cat "$RUNNER_TEMP/bot-fragments/+bot.bugfix.md")" >"$RUNNER_TEMP/bot-changelog.md"
        release-creator notes \
          --changelog "$RUNNER_TEMP/bot-changelog.md" \
          --tag 1.0.0 \
          --repository tox-dev/devpi-process \
          --generated-notes "$RUNNER_TEMP/bot-generated.md" >"$RUNNER_TEMP/bot-notes.md"
    - name: Check bot author credits
      shell: bash
      run: |
        grep -Fq '[#288](https://github.com/tox-dev/devpi-process/pull/288)' "$RUNNER_TEMP/bot-notes.md"
        ! grep -Fq '@dependabot' "$RUNNER_TEMP/bot-notes.md"
