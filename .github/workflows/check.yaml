name: Check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked tools
        run: |
          uv venv --python 3.15 .venv
          uv pip sync --preview-features pylock --python .venv/bin/python pylock.toml
          echo "$PWD/.venv/bin" >>"$GITHUB_PATH"
      - name: Check repository formatting
        run: prek run --all-files
      - name: Check Python tests
        run: |
          ruff format --check .
          ruff check . --output-format=concise
          ty check tests
      - name: Measure Action shell coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov
          KCOV_BIN=kcov KCOV_OUTPUT="$RUNNER_TEMP/shell-coverage" pytest -q
          kcov --merge "$RUNNER_TEMP/shell-coverage-merged" "$RUNNER_TEMP/shell-coverage"/*
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          report = next(Path(os.environ["RUNNER_TEMP"], "shell-coverage-merged").rglob("codecov.json"))
          coverage = json.loads(report.read_text())["coverage"]
          expected = {
              f"{path.parent.name}-{index}.sh"
              for path in Path().glob("*/action.yml")
              for index, _ in enumerate(yaml.safe_load(path.read_text())["runs"]["steps"])
          }
          if set(coverage) != expected or any(not lines or not all(lines.values()) for lines in coverage.values()):
              raise SystemExit(f"Action shell coverage is below 100%: {coverage}")
          PY
      - name: Check inline shell
        run: |
          set -euo pipefail
          for file in .github/workflows/*.yaml */action.yml; do
            yq -rj '[.. | objects | select(has("run")) | .run] | .[] | . + "\u0000"' "$file" \
              >"$RUNNER_TEMP/run-blocks"
            index=0
            while IFS= read -r -d '' script; do
              echo "$file: run block $index"
              printf '#!/usr/bin/env bash\n%s\n' "${script%$'\n'}" >"$RUNNER_TEMP/inline-shell.sh"
              prek run shellcheck --files "$RUNNER_TEMP/inline-shell.sh"
              prek run shfmt --files "$RUNNER_TEMP/inline-shell.sh"
              index=$((index + 1))
            done <"$RUNNER_TEMP/run-blocks"
          done
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: $/validate-news
  release-dry-run:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/validate-release.yaml
    permissions:
      contents: read
      pull-requests: read
  release-tools-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - uses: $/refresh-release-lock
        with:
          groups: release
          python-version: "3.15"
  gate:
    name: Required checks pass
    if: always()
    needs: [check, changelog, release-dry-run, release-tools-preview]
    runs-on: ubuntu-26.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e '
            all(
              to_entries[];
              .value.result == "success" or
              (.key == "changelog" and .value.result == "skipped") or
              (.key == "release-dry-run" and .value.result == "skipped") or
              (.key == "release-tools-preview" and .value.result == "skipped")
            )
          ' <<<"$NEEDS_JSON"
