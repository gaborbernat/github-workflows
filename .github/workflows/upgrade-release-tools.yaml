name: Upgrade release tools
on:
  workflow_call:
    inputs:
      lock:
        description: Path to the checked-in pylock file
        type: string
        default: pylock.toml
      groups:
        description: Comma-separated pyproject dependency groups to refresh
        type: string
        default: release
      python-version:
        description: Python version used to resolve and check the lock
        type: string
        default: "3.15"
      branch:
        description: Branch used for the dependency pull request
        type: string
        default: automation/update-release-tools
      check-workflow:
        description: Workflow dispatched on the update branch
        type: string
        default: check.yaml
      base:
        description: Target branch for the dependency pull request
        type: string
        default: main
permissions: {}
jobs:
  generate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - name: Refresh release tool lock
        env:
          LOCK: ${{ inputs.lock }}
          DEP_GROUPS: ${{ inputs.groups }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          read -ra groups <<<"${DEP_GROUPS//,/ }"
          args=()
          has_release=false
          for group in "${groups[@]}"; do
            case "$group" in
            '' | [!a-zA-Z]* | *[!a-zA-Z0-9_-]*)
              echo "::error::invalid dependency group: $group" >&2
              exit 1
              ;;
            esac
            if [[ "$group" == release ]]; then
              has_release=true
            fi
            args+=(--group "pyproject.toml:$group")
          done
          if [[ "$has_release" != true ]]; then
            echo '::error::release dependency group is required' >&2
            exit 1
          fi
          uv pip compile --preview-features pylock "${args[@]}" --universal \
            --python-version "$PYTHON_VERSION" --generate-hashes --upgrade \
            --output-file "$LOCK"
      - name: Check refreshed lock
        env:
          LOCK: ${{ inputs.lock }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" \
            --group release "$LOCK"
          "$RUNNER_TEMP/release-tools/bin/prek" run --all-files
          while IFS= read -r entry; do
            path=${entry:3}
            if [[ "$path" != "$LOCK" ]]; then
              echo "::error::prek changed file outside $LOCK: $path" >&2
              exit 1
            fi
          done < <(git status --porcelain=v1 --untracked-files=all)
      - id: lock
        env:
          LOCK: ${{ inputs.lock }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$LOCK"; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >>"$GITHUB_OUTPUT"
          git diff --binary -- "$LOCK" >"$RUNNER_TEMP/lock.patch"
          test -s "$RUNNER_TEMP/lock.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lock.outputs.changed == 'true'
        with:
          name: release-tools-lock
          path: ${{ runner.temp }}/lock.patch
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: generate
    if: needs.generate.outputs.changed == 'true' && github.ref == format('refs/heads/{0}', inputs.base)
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tools-lock
          path: ${{ runner.temp }}/release-tools-lock
      - name: Validate and apply lock patch
        env:
          LOCK: ${{ inputs.lock }}
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/release-tools-lock/lock.patch"
          git apply --index "$RUNNER_TEMP/release-tools-lock/lock.patch"
          paths=$(git diff --cached --name-only)
          if [[ "$paths" != "$LOCK" ]]; then
            echo "::error::unexpected lock paths: $paths" >&2
            exit 1
          fi
          git diff --cached --check
      - name: Open or update dependency pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
          CHECK_WORKFLOW: ${{ inputs.check-workflow }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '🔧 build(deps): refresh release lock'
          gh auth setup-git --hostname github.com --force
          git push --force origin "HEAD:$BRANCH"
          cat >"$RUNNER_TEMP/pull-request.md" <<'EOF'
          🔧 Refresh the locked release tools to the latest versions allowed by the release dependency group.
          The lock records the exact versions used by release and changelog workflows.
          EOF
          pr_number=$(gh pr list --base "$BASE" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title '🔧 build(deps): refresh release tool lock' \
              --body-file "$RUNNER_TEMP/pull-request.md" --add-label dependencies --add-label 'skip news'
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title '🔧 build(deps): refresh release tool lock' \
              --body-file "$RUNNER_TEMP/pull-request.md" --label dependencies --label 'skip news'
          fi
          gh workflow run "$CHECK_WORKFLOW" --ref "$BRANCH"
