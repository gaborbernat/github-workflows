name: Validate Python release
on:
  workflow_call:
    inputs:
      changelog:
        description: Tracked changelog path
        required: true
        type: string
      fragments:
        description: Towncrier fragment directory
        required: true
        type: string
      format:
        description: Changelog format passed to prepare-towncrier
        required: true
        type: string
      artifact-base-url:
        description: Ecosystem release URL without the version
        required: true
        type: string
      artifact-label:
        description: Link text for the ecosystem release
        default: PyPI release
        type: string
      issue-role:
        description: Target for reStructuredText issue roles
        default: issue
        type: string
      fixture-issue:
        description: Issue number to link in a synthetic reStructuredText release entry
        default: ""
        type: string
      lock:
        description: Release-tool pylock.toml path
        default: pylock.toml
        type: string
      python-version:
        description: Python version for release tooling and package build
        default: "3.15"
        type: string
      source:
        description: Package source directory
        default: .
        type: string
      artifact-prefix:
        description: Prefix for artifacts when comparing two release paths in one run
        default: ""
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: false
      - name: Install locked release tools
        env:
          LOCK: ${{ inputs.lock }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          uv venv --python "$PYTHON_VERSION" "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release "$LOCK"
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Check bot author credits
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/tox-dev/devpi-process/pulls/288 --jq .user.login)" = 'dependabot[bot]'
          test "$(gh api repos/tox-dev/devpi-process/pulls/288 --jq .user.type)" = Bot
          mkdir "$RUNNER_TEMP/bot-fragments"
          printf 'Document a bot-owned dependency fix.\n' >"$RUNNER_TEMP/bot-fragments/+bot.bugfix.md"
          printf '+bot.bugfix.md\tDependency update (#288)\n' >"$RUNNER_TEMP/bot-commits.tsv"
          release-creator fragments \
            --directory "$RUNNER_TEMP/bot-fragments" \
            --repository tox-dev/devpi-process \
            --commit-map "$RUNNER_TEMP/bot-commits.tsv" \
            --resolve-authors
          printf '## 1.0.0 (today)\n\n### Fixed\n\n- %s\n' \
            "$(cat "$RUNNER_TEMP/bot-fragments/+bot.bugfix.md")" >"$RUNNER_TEMP/bot-changelog.md"
          printf '* Dependency update by @dependabot[bot] in https://github.com/tox-dev/devpi-process/pull/288\n' \
            >"$RUNNER_TEMP/bot-generated.md"
          release-creator notes \
            --changelog "$RUNNER_TEMP/bot-changelog.md" \
            --tag 1.0.0 \
            --repository tox-dev/devpi-process \
            --generated-notes "$RUNNER_TEMP/bot-generated.md" >"$RUNNER_TEMP/bot-notes.md"
          grep -Fq '[#288](https://github.com/tox-dev/devpi-process/pull/288)' "$RUNNER_TEMP/bot-notes.md"
          ! grep -Fq '@dependabot' "$RUNNER_TEMP/bot-notes.md"
      - name: Check historical multiple-author credits
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/tox-dev/filelock/pulls/213 --jq .user.login)" = jahrules
          for author in jahrules gaborbernat; do
            test "$(gh api "users/$author" --jq .type)" = User
          done
          gh api 'repos/tox-dev/filelock/contents/docs/changelog.rst?ref=622ae3cb4cfd2dfaca66bc49c74656639f4cdfdb' \
            --jq .content | base64 -d >"$RUNNER_TEMP/multiple-author-changelog.rst"
          printf '%s  %s\n' \
            91fccb09c0178e8f44650b86cc5921d5c5fd2d002b428532e74329a63d502bb4 \
            "$RUNNER_TEMP/multiple-author-changelog.rst" | sha256sum --check
          release-creator notes \
            --changelog "$RUNNER_TEMP/multiple-author-changelog.rst" \
            --tag 3.10.6 \
            --repository tox-dev/filelock \
            --previous 3.10.5 \
            --issue-role pull >"$RUNNER_TEMP/multiple-author-notes.md"
          grep -Fq '[#213](https://github.com/tox-dev/filelock/pull/213) by @jahrules and @gaborbernat.' \
            "$RUNNER_TEMP/multiple-author-notes.md"
          test "$(grep -oF 'https://github.com/tox-dev/filelock/pull/213' \
            "$RUNNER_TEMP/multiple-author-notes.md" | wc -l)" -eq 1
      - name: Create a local release candidate
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        id: fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FRAGMENTS: ${{ inputs.fragments }}
          CHANGELOG: ${{ inputs.changelog }}
          FIXTURE_ISSUE: ${{ inputs.fixture-issue }}
          ISSUE_ROLE: ${{ inputs.issue-role }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_sha=${BASE_SHA:-$(git rev-parse origin/main)}
          head_sha=${HEAD_SHA:-$GITHUB_SHA}
          if [[ -z "$PR_NUMBER" ]]; then
            PR_NUMBER=$(gh pr list --head "$GITHUB_REF_NAME" --base main --state open --json number --jq '.[0].number')
            if [[ -z "$PR_NUMBER" ]]; then
              echo "::error::no open pull request for $GITHUB_REF_NAME"
              exit 1
            fi
          fi
          git checkout -B release-validation "$base_sha"
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com merge --squash "$head_sha"
          case "$CHANGELOG" in
          *.md) extension=md ;;
          *.rst) extension=rst ;;
          *)
            echo "::error::unsupported changelog format: $CHANGELOG" >&2
            exit 1
            ;;
          esac
          mkdir -p "$FRAGMENTS"
          if [[ -n "$FIXTURE_ISSUE" ]]; then
            if [[ "$extension" != rst || "$ISSUE_ROLE" != issue || "$FIXTURE_ISSUE" == *[!0-9]* ]]; then
              echo '::error::fixture-issue requires an RST changelog, issue role, and numeric issue' >&2
              exit 1
            fi
            printf "Verify a user-visible release fix for :issue:\`%s\`.\n" "$FIXTURE_ISSUE" \
              >"$FRAGMENTS/+validation-${PR_NUMBER}.bugfix.$extension"
          else
            printf 'Verify a user-visible release fix.\n' >"$FRAGMENTS/+validation-${PR_NUMBER}.bugfix.$extension"
          fi
          test ! -e "$FRAGMENTS/${PR_NUMBER}.bugfix.$extension"
          printf 'Verify a numbered release fix.\n' >"$FRAGMENTS/${PR_NUMBER}.bugfix.$extension"
          git add -A
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com commit -m "Validate release pipeline (#${PR_NUMBER})"
          git init --bare "$RUNNER_TEMP/rehearsal.git"
          git remote add rehearsal "$RUNNER_TEMP/rehearsal.git"
          git push rehearsal HEAD:main
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "pr=$PR_NUMBER"
            echo "extension=$extension"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '"author=\(.user.login)\nauthor_type=\(.user.type)"'
          } >>"$GITHUB_OUTPUT"
      - name: Introduce an unsupported fragment
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          FRAGMENTS: ${{ inputs.fragments }}
          PR_NUMBER: ${{ steps.fixture.outputs.pr }}
          EXTENSION: ${{ steps.fixture.outputs.extension }}
        run: |
          git mv "$FRAGMENTS/+validation-${PR_NUMBER}.bugfix.$EXTENSION" "$FRAGMENTS/validation-${PR_NUMBER}.bugfix.$EXTENSION"
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com commit -m "Validate fragment rejection"
          git push rehearsal HEAD:main
      - id: invalid_fragment
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        name: Reject an unsupported fragment
        uses: $/prepare-towncrier
        continue-on-error: true
        with:
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          format: ${{ inputs.format }}
          patch: ${{ runner.temp }}/release.patch
      - name: Check fragment rejection
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          OUTCOME: ${{ steps.invalid_fragment.outcome }}
          SOURCE_SHA: ${{ steps.fixture.outputs.sha }}
        run: |
          test "$OUTCOME" = failure
          git reset --hard "$SOURCE_SHA"
          git push --force rehearsal HEAD:main
      - name: Dirty the release checkout
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: touch untracked-release-file
      - id: dirty_prepare
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        name: Reject a dirty release checkout
        uses: $/prepare-towncrier
        continue-on-error: true
        with:
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          format: ${{ inputs.format }}
          patch: ${{ runner.temp }}/release.patch
      - name: Check dirty checkout rejection
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          OUTCOME: ${{ steps.dirty_prepare.outcome }}
        run: |
          test "$OUTCOME" = failure
          rm untracked-release-file
      - name: Create an empty fragment directory
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: mkdir "$RUNNER_TEMP/empty-fragments"
      - id: missing_fragment
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        name: Reject a missing release fragment
        uses: $/prepare-towncrier
        continue-on-error: true
        with:
          fragments: ${{ runner.temp }}/empty-fragments
          changelog: ${{ inputs.changelog }}
          format: ${{ inputs.format }}
          patch: ${{ runner.temp }}/missing-fragment.patch
      - name: Check missing fragment rejection
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          OUTCOME: ${{ steps.missing_fragment.outcome }}
        run: test "$OUTCOME" = failure
      - id: prepare
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: $/prepare-towncrier
        with:
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          format: ${{ inputs.format }}
          patch: ${{ runner.temp }}/release.patch
      - name: Restore release candidate
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: git reset --hard HEAD
      - name: Make the candidate tag stale
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: git tag "$VERSION"
      - id: stale_tag
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        name: Reject an existing release tag
        uses: $/prepare-towncrier
        continue-on-error: true
        with:
          version: ${{ steps.prepare.outputs.version }}
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          format: ${{ inputs.format }}
          patch: ${{ runner.temp }}/stale-tag.patch
      - name: Check stale tag rejection
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          OUTCOME: ${{ steps.stale_tag.outcome }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          test "$OUTCOME" = failure
          git tag -d "$VERSION"
      - id: stale_validate
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        name: Reject a stale release branch
        uses: $/validate-release-patch
        continue-on-error: true
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/release.patch
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          remote: rehearsal
          expected-sha: "0000000000000000000000000000000000000000"
      - name: Check stale branch rejection
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          OUTCOME: ${{ steps.stale_validate.outcome }}
        run: test "$OUTCOME" = failure
      - name: Add an unrelated file to the release patch
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          printf 'invalid patch probe\n' >release-validation-unexpected.txt
          git add -N release-validation-unexpected.txt
          git diff --binary -- release-validation-unexpected.txt >"$RUNNER_TEMP/unexpected-path.patch"
          git reset -- release-validation-unexpected.txt
          rm release-validation-unexpected.txt
          cat "$RUNNER_TEMP/release.patch" "$RUNNER_TEMP/unexpected-path.patch" >"$RUNNER_TEMP/invalid.patch"
          git apply --check "$RUNNER_TEMP/invalid.patch"
      - id: invalid_patch
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        name: Reject a release patch with an unrelated file
        uses: $/validate-release-patch
        continue-on-error: true
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/invalid.patch
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          remote: rehearsal
          expected-sha: ${{ steps.fixture.outputs.sha }}
      - name: Check unrelated path rejection
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          OUTCOME: ${{ steps.invalid_patch.outcome }}
        run: |
          test "$OUTCOME" = failure
          git diff --cached --name-only | grep -Fxq release-validation-unexpected.txt
          git reset --hard HEAD
      - if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: $/validate-release-patch
        with:
          version: ${{ steps.prepare.outputs.version }}
          patch: ${{ runner.temp }}/release.patch
          changelog: ${{ inputs.changelog }}
          fragments: ${{ inputs.fragments }}
          remote: rehearsal
          expected-sha: ${{ steps.fixture.outputs.sha }}
      - name: Commit and tag the local candidate
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com commit -m "release $VERSION"
          git tag "$VERSION"
      - name: Render tagged-source notes
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: $/render-release-notes
        with:
          tag: ${{ steps.prepare.outputs.version || github.ref_name }}
          changelog: ${{ inputs.changelog }}
          repository: ${{ github.repository }}
          artifact-url: ${{ inputs.artifact-base-url }}${{ steps.prepare.outputs.version || github.ref_name }}/
          artifact-label: ${{ inputs.artifact-label }}
          issue-role: ${{ inputs.issue-role }}
          output: ${{ runner.temp }}/${{ github.event_name == 'push' && 'release-notes.md' || 'tag-preview-notes.md' }}
      - uses: $/build-python-distribution
        with:
          lock: ${{ inputs.lock }}
          python-version: ${{ inputs.python-version }}
          source: ${{ inputs.source }}
      - name: Prepare contributor fixture
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        id: metadata
        env:
          PR_NUMBER: ${{ steps.fixture.outputs.pr }}
          PR_AUTHOR: ${{ steps.fixture.outputs.author }}
        run: |
          printf '* Validate release pipeline by @%s in https://github.com/%s/pull/%s\n' \
            "$PR_AUTHOR" "$GITHUB_REPOSITORY" "$PR_NUMBER" >"$RUNNER_TEMP/generated-notes.md"
          echo "path=$RUNNER_TEMP/generated-notes.md" >>"$GITHUB_OUTPUT"
      - id: invalid_tag
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        name: Reject an invalid release tag
        uses: $/render-release-notes
        continue-on-error: true
        with:
          tag: bad tag
          changelog: ${{ inputs.changelog }}
          repository: ${{ github.repository }}
          output: ${{ runner.temp }}/invalid-tag-notes.md
      - name: Check invalid tag rejection
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          OUTCOME: ${{ steps.invalid_tag.outcome }}
        run: test "$OUTCOME" = failure
      - id: missing_changelog
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        name: Reject a missing changelog
        uses: $/render-release-notes
        continue-on-error: true
        with:
          tag: ${{ steps.prepare.outputs.version }}
          changelog: missing-changelog.md
          repository: ${{ github.repository }}
          output: ${{ runner.temp }}/missing-changelog-notes.md
      - name: Check missing changelog rejection
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          OUTCOME: ${{ steps.missing_changelog.outcome }}
        run: test "$OUTCOME" = failure
      - uses: $/render-release-notes
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        with:
          tag: ${{ steps.prepare.outputs.version || github.ref_name }}
          changelog: ${{ inputs.changelog }}
          repository: ${{ github.repository }}
          artifact-url: ${{ inputs.artifact-base-url }}${{ steps.prepare.outputs.version || github.ref_name }}/
          artifact-label: ${{ inputs.artifact-label }}
          issue-role: ${{ inputs.issue-role }}
          generated-notes: ${{ steps.metadata.outputs.path }}
          output: ${{ runner.temp }}/release-notes.md
      - name: Inspect candidate artifacts
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ steps.fixture.outputs.pr }}
          PR_AUTHOR: ${{ steps.fixture.outputs.author }}
          PR_AUTHOR_TYPE: ${{ steps.fixture.outputs.author_type }}
          FIXTURE_ISSUE: ${{ inputs.fixture-issue }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          test "$(grep -c '^\*\*Full Changelog\*\*:' "$RUNNER_TEMP/release-notes.md")" -eq 1
          grep -Fq "[#${PR_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER})" "$RUNNER_TEMP/release-notes.md"
          if [[ -n "$FIXTURE_ISSUE" ]]; then
            grep -Fq "[#${FIXTURE_ISSUE}](https://github.com/${GITHUB_REPOSITORY}/issues/${FIXTURE_ISSUE})" \
              "$RUNNER_TEMP/release-notes.md"
            grep -Fq ":issue:\`${FIXTURE_ISSUE}\`" "$CHANGELOG"
          fi
          numbered=$(grep -F 'Verify a numbered release fix' "$RUNNER_TEMP/release-notes.md")
          test "$(grep -oF "https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}" <<<"$numbered" | wc -l)" -eq 1
          changelog_numbered=$(grep -F -A3 'Verify a numbered release fix' "$CHANGELOG")
          if [[ "$CHANGELOG" == *.rst ]]; then
            grep -Fq ":pr:\`${PR_NUMBER}\`" <<<"$changelog_numbered"
          else
            grep -Fq "https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}" <<<"$changelog_numbered"
          fi
          if [[ "$PR_AUTHOR_TYPE" == Bot ]]; then
            if grep -Fq "by @${PR_AUTHOR}" "$RUNNER_TEMP/release-notes.md"; then
              echo '::error::bot credit in release notes'
              exit 1
            fi
            if grep -Fq "by @${PR_AUTHOR}" <<<"$numbered"; then
              echo '::error::bot credit in numbered release note'
              exit 1
            fi
          else
            grep -Fq "by @${PR_AUTHOR}" "$RUNNER_TEMP/release-notes.md"
            grep -Fq "by @${PR_AUTHOR}" <<<"$numbered"
            grep -Fq "$PR_AUTHOR" <<<"$changelog_numbered"
          fi
          if grep -Fq '<!-- Release notes generated' "$RUNNER_TEMP/release-notes.md"; then
            echo '::error::generated-notes banner in release notes'
            exit 1
          fi
          test "$(grep -c '^\*\*Full Changelog\*\*:' "$RUNNER_TEMP/tag-preview-notes.md")" -eq 1
          if grep -Fq '<!-- Release notes generated' "$RUNNER_TEMP/tag-preview-notes.md"; then
            echo '::error::generated-notes banner in tag preview'
            exit 1
          fi
          sha256sum dist/* >"$RUNNER_TEMP/dist.sha256"
          cp "$CHANGELOG" "$RUNNER_TEMP/changelog"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}python-package-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}release-validation-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
      - if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}release-dry-run
          path: |
            ${{ runner.temp }}/release.patch
            ${{ runner.temp }}/release-notes.md
            ${{ runner.temp }}/generated-notes.md
            ${{ runner.temp }}/tag-preview-notes.md
            ${{ runner.temp }}/changelog
            ${{ runner.temp }}/dist.sha256
            ${{ runner.temp }}/bot-notes.md
            ${{ runner.temp }}/multiple-author-notes.md
            dist/*
          if-no-files-found: error
