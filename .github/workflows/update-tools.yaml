name: Update release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 2"
permissions: {}
jobs:
  update:
    uses: $/.github/workflows/upgrade-release-tools.yaml
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      groups: release,test
      python-version: "3.15"
      check-workflow: check.yaml
